  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);

  #wrap{max-width:760px;margin:0 auto;padding:96px 24px 110px}
  header{display:flex;justify-content:space-between;align-items:baseline;
    border-bottom:1px solid rgba(120,150,190,.25);padding-bottom:14px;margin-bottom:44px;
    letter-spacing:.18em;font-size:13px;color:var(--dim)}
  header b{color:var(--fg);font-weight:400}

  p{font-size:14px;margin:0 0 16px;line-height:2}
  .lead{color:#e8eef8}
  .block{margin:24px 0;padding:18px 22px;background:#0e1018;
    border:1px solid rgba(120,150,190,.2);color:#9fb0cc;font-size:13.5px;
    line-height:2.1;white-space:pre;overflow-x:auto;letter-spacing:.12em}
  #lattice{margin:22px 0;padding:18px 22px;background:#0e1018;
    border:1px solid rgba(120,150,190,.2);overflow-x:auto}
  #lattice .row{white-space:pre;font-size:12.5px;line-height:2.2;letter-spacing:.12em;color:#9fb0cc}
  .dim{color:var(--dim);font-size:13px}
  .redact{background:#000;color:#000;border-radius:1px}
  .narrow{display:none}
  @media (max-width:760px){ .narrow{display:block;color:#e6b450;font-size:13px;letter-spacing:.05em} }
  .err{color:#8b93a8;font-size:17px;line-height:2.1;
    border-left:2px solid rgba(120,150,190,.3);padding-left:22px;margin-bottom:30px}
  .hide{display:none}
  footer{margin-top:90px;padding-top:16px;border-top:1px solid rgba(120,150,190,.18);
    font-size:12px;color:#3f485d;letter-spacing:.16em;display:flex;justify-content:space-between}
